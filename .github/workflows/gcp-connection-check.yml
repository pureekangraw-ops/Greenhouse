name: GCP connection check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gcp-connection-check
  cancel-in-progress: false
jobs:
  identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: gohub-509103
      PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/go-github-dev/providers/greenhouse$ ]]
          [[ "$SERVICE_ACCOUNT" == 'go-github-check@gohub-509103.iam.gserviceaccount.com' ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: gohub-509103
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Read project through federated credentials
        shell: bash
        run: |
          set -euo pipefail
          gcloud projects describe "$GCP_PROJECT_ID" --format=json > "$RUNNER_TEMP/go-project-readback.json"
          python3 - "$RUNNER_TEMP/go-project-readback.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as f:
              project = json.load(f)
          assert project['projectId'] == 'gohub-509103', 'Unexpected project'
          assert project['lifecycleState'] == 'ACTIVE', 'Project not active'
          print('PASS: federated credentials read the intended active project')
          PY
          printf '### Google Cloud connection\n\nProject: `%s`\n\nFederated project read: PASS\n\nRun: `%s`; commit: `%s`\n\nBuild/Compute permissions are not configured in this check.\n' "$GCP_PROJECT_ID" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
