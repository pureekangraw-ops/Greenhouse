name: HERMES Android

on:
  push:
    branches:
      - feat/hermes-android-greenhouse-v0.1
    paths:
      - 'apps/hermes-android/**'
      - '.github/workflows/hermes-android.yml'
  pull_request:
    paths:
      - 'apps/hermes-android/**'
      - '.github/workflows/hermes-android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Greenhouse checks
        run: npm run check && npm test
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: apps/hermes-android/**/*.gradle*
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Unit tests, lint, and debug APK
        working-directory: apps/hermes-android
        run: bash ./gradlew --no-daemon --stacktrace :app:testHermesDebugUnitTest :app:lintHermesDebug :app:assembleHermesDebug
      - name: Preserve HERMES test and lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-diagnostics-${{ github.sha }}
          path: |
            apps/hermes-android/app/build/reports/tests/
            apps/hermes-android/app/build/test-results/
            apps/hermes-android/app/build/reports/lint-results-*
            apps/hermes-android/app/build/outputs/lint-results-*
          if-no-files-found: warn
          retention-days: 14
      - name: Verify APK identity and checksum
        working-directory: apps/hermes-android
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/hermes/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk"
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")"
          echo "$badging" | grep -E "package: name='com.ollitert.llm.server.hermes' versionCode='[1-9][0-9]*' versionName='0\\.9\\.7'"
          sha256sum "$apk" | tee app/build/outputs/apk/hermes/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-debug-apk-${{ github.sha }}
          path: |
            apps/hermes-android/app/build/outputs/apk/hermes/debug/*.apk
            apps/hermes-android/app/build/outputs/apk/hermes/debug/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
