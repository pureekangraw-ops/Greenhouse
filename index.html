<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Metropolis Genome Hub — coordinate reports and work across Shop, Office, and Greenhouse." />
  <title>Metropolis · Genome Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2320201e'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div>
          <p class="eyebrow">METROPOLIS</p>
          <h1>Genome Hub</h1>
        </div>
      </div>

      <div class="hub-state">
        <span class="status-dot status-dot--live"></span>
        <div>
          <strong>Hub surface</strong>
          <span>Contract draft · not connected</span>
        </div>
      </div>

      <nav class="nav-group" aria-label="Workspace">
        <p class="nav-label">WORKSPACE</p>
        <button class="nav-item is-active" data-view="home"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-item" data-view="shop"><span class="nav-icon">▦</span>Genome Shop</button>
        <button class="nav-item" data-view="office"><span class="nav-icon">▤</span>Genome Office</button>
        <button class="nav-item" data-view="greenhouse"><span class="nav-icon">♧</span>Genome Greenhouse</button>
      </nav>

      <nav class="nav-group" aria-label="Coordination">
        <p class="nav-label">COORDINATION</p>
        <button class="nav-item" data-view="reports"><span class="nav-icon">◫</span>Reports</button>
        <button class="nav-item" data-view="activity"><span class="nav-icon">↗</span>Readback log</button>
      </nav>

      <div class="sidebar-footer">
        <div class="actor-card">
          <div class="avatar">G</div>
          <div>
            <strong>Genome Hub</strong>
            <span>Coordinator</span>
          </div>
          <span class="more">•••</span>
        </div>
        <p class="footer-note">One Hub · three Genomes · traceable returns</p>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="breadcrumbs"><span>Metropolis</span><span class="crumb-separator">/</span><strong id="current-view-label">Overview</strong></div>
        <div class="top-actions">
          <button class="icon-button" type="button" aria-label="Search">⌕</button>
          <button class="icon-button" type="button" aria-label="Notifications">◌<span class="notification-dot"></span></button>
          <button class="avatar avatar--small" type="button" aria-label="Open profile">P</button>
        </div>
      </header>

      <div id="app" class="content-wrap"></div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js"></script>
</body>
</html>
